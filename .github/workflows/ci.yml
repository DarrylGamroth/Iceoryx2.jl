name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      matrix:
        version: ['1', 'lts', 'nightly']
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/add-julia-registry@v2
        with:
          registry: DarrylGamroth/PackageRegistry
          protocol: https
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # - name: Add PackageRegistry
      #   run: |
      #     julia -e 'using Pkg; Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/DarrylGamroth/PackageRegistry.git"))'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Verify generated files
        if: matrix.version == '1'
        run: julia --startup-file=no --project=gen gen/verify_generated.jl
      - name: Verify C ABI coverage
        run: julia --startup-file=no --project=. scripts/coverage_symbols.jl
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
